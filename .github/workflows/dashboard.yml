name: Dashboard contracts and Streamlit smoke tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dashboard.txt
      - name: Install isolated dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test imports, transformations, charts and application interactions
        run: python -m pytest dashboard/tests -q
